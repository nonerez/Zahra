name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Unpack project zip
        run: |
          for z in *.zip; do
            [ -f "$z" ] && unzip -qo "$z"
          done || true

      - name: Locate project
        id: loc
        run: |
          echo "dir=$(dirname "$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)")" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: ${{ steps.loc.outputs.dir }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: nonevid-debug-apk
          path: "**/app-debug.apk"
          if-no-files-found: error
